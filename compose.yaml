# Portal and Compose-managed grading services.
name: dbs2-task-checker

services:
  # Static frontend + reverse proxy. The only service that publishes ports to the host.
  # Browser -> :80 (/ -> React bundle, /api/* -> server:8080)
  web:
    build:
      context: ./web
      dockerfile: Containerfile
    image: dbs2-task-checker-web
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

  # Bun / Elysia API
  server:
    cpus: 2
    mem_limit: 1g
    pids_limit: 128
    build:
      context: ./server
      dockerfile: Containerfile
    image: dbs2-task-checker-server
    restart: unless-stopped
    environment:
      PORT: 8080
      REFERENCE_CACHE_VERSION: "${REFERENCE_CACHE_VERSION:-executor-v1}"
      PORTAL_LOGIN_SOCKET: /run/portal-login/approve.sock
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      # Portal database: users, question banks, submissions
      DB_CONNECTION_URL: "${DB_CONNECTION_URL:-mongodb://host.containers.internal:27017}"
      # Personal database endpoints are used only by the admin Services page.
      MONGO_SANDBOX_HOST: "${MONGO_SANDBOX_HOST:-host.containers.internal}"
      MONGO_SANDBOX_PORT: "${MONGO_SANDBOX_PORT:-42222}"
      REDIS_SANDBOX_HOST: "${REDIS_SANDBOX_HOST:-host.containers.internal}"
      MONGO_EXECUTOR_SOCKET: /run/execution/mongo.sock
      REDIS_GRADING_URL: redis://grading-redis:6379
      REDIS_GRADING_PASSWORD: "${GRADING_REDIS_PASSWORD:?Set GRADING_REDIS_PASSWORD in .env}"
      PORTAL_LOGIN_SOCKET_MODE: "666"
      PORTAL_LOGIN_COMMAND: "${PORTAL_LOGIN_COMMAND:-portal-login}"
      # Password reset of student Linux accounts over SSH (server/scripts/host/README.md).
      # Leave the target empty to disable the feature.
      PASSWORD_RESET_SSH_TARGET: "${PASSWORD_RESET_SSH_TARGET:-}"
      PASSWORD_RESET_SSH_KEY: /run/secrets/portal-ssh-key
      # Extra endpoints shown on the Services page (the portal/sandbox databases and the Redis
      # instances are checked automatically): Name=tcp://host:port or Name=http://host:port/
      INFRA_SERVICES: "${INFRA_SERVICES:-}"
    volumes:
      - "${PORTAL_LOGIN_DIR:-./run/login}:/run/portal-login:z"
      - mongo-execution:/run/execution
      # `z` relabels for SELinux hosts (Fedora/RHEL); ignored elsewhere
      - "${DATASETS_DIR:-./server/datasets}:/app/datasets:ro,z"
      # Private key for the password reset; /dev/null when the feature is not used
      - "${PASSWORD_RESET_SSH_KEY_FILE:-/dev/null}:/run/secrets/portal-ssh-key:ro"
    networks:
      - default
      - redis-grading
    depends_on:
      mongo-executor:
        condition: service_healthy
      grading-redis:
        condition: service_healthy
    extra_hosts:
      # podman adds this name by itself; Docker on Linux needs it spelled out
      - "host.containers.internal:host-gateway"

  # Separate from the portal database. Each grading attempt gets its own scoped database.
  grading-mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${GRADING_MONGO_PASSWORD:?Set GRADING_MONGO_PASSWORD in .env}"
    read_only: true
    tmpfs:
      - /data/db:rw,size=768m
      - /data/configdb:rw,size=16m
      - /tmp:rw,size=32m,mode=1777
    networks: [mongo-grading]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Persistent client executor: starts mongosh processes, never containers.
  mongo-executor:
    build:
      context: ./server/scripts/grading
      dockerfile: Containerfile
    image: dbs2-task-checker-mongo-executor
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    environment:
      GRADING_MONGO_HOST: grading-mongo
      GRADING_MONGO_PASSWORD: "${GRADING_MONGO_PASSWORD:?Set GRADING_MONGO_PASSWORD in .env}"
    volumes:
      - mongo-execution:/run/execution
      - "${DATASETS_DIR:-./server/datasets}/mongodb:/datasets:ro,z"
    tmpfs:
      - /tmp:rw,size=256m,mode=1777
    networks: [mongo-grading]
    depends_on:
      grading-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/execution/mongo.sock'); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  grading-redis:
    image: docker.io/redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    tmpfs:
      - /data:rw,size=256m
    networks: [redis-grading]
    command:
      - redis-server
      - --protected-mode
      - "no"
      - --loadmodule
      - /opt/redis-stack/lib/redisearch.so
      - --loadmodule
      - /opt/redis-stack/lib/rejson.so
      - --save
      - ""
      - --appendonly
      - "no"
      - --databases
      - "1"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --client-output-buffer-limit
      - "normal 1048576 0 0"
      - --lua-time-limit
      - "1000"
      - --user
      - "default"
      - "on"
      - "nopass"
      - "~*"
      - "&*"
      - "+@all"
      - "-@admin"
      - "-migrate"
      - "-restore-asking"
      - --user
      - admin
      - on
      - ">${GRADING_REDIS_PASSWORD:?Set GRADING_REDIS_PASSWORD in .env}"
      - "~*"
      - "&*"
      - "+@all"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy-data:
  caddy-config:

  mongo-execution:

networks:
  default:
  mongo-grading:
    internal: true
  redis-grading:
    internal: true
