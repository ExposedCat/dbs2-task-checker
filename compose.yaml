# Portal (frontend + API) using databases that already run on the host:
# the portal MongoDB, the sandbox MongoDB and the per-student Redis instances are reached
# through host.containers.internal (= the host machine and the ports published on it).
#
# For a self-contained setup with bundled databases add the overlay:
#   podman-compose -f compose.yaml -f compose.local-db.yaml up -d --build
name: dbs2-task-checker

services:
  # Static frontend + reverse proxy. The only service that publishes ports to the host.
  # Browser -> :80 (/ -> React bundle, /api/* -> server:8080)
  web:
    build: ./web
    image: dbs2-task-checker-web
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

  # Bun / Elysia API
  server:
    build: ./server
    image: dbs2-task-checker-server
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      # Portal database: users, question banks, submissions
      DB_CONNECTION_URL: "${DB_CONNECTION_URL:-mongodb://host.containers.internal:27017}"
      # Sandbox MongoDB where student queries run (one database + user per student)
      MONGO_SANDBOX_HOST: "${MONGO_SANDBOX_HOST:-host.containers.internal}"
      MONGO_SANDBOX_PORT: "${MONGO_SANDBOX_PORT:-42222}"
      # Host of the per-student Redis instances (port = user.port in the portal)
      REDIS_SANDBOX_HOST: "${REDIS_SANDBOX_HOST:-host.containers.internal}"
      # Only used by scripts/create-user.ts
      MONGO_SANDBOX_ROOT_URL: "${MONGO_SANDBOX_ROOT_URL:-}"
    volumes:
      # `z` relabels for SELinux hosts (Fedora/RHEL); ignored elsewhere
      - "${DATASETS_DIR:-./server/datasets}:/app/datasets:ro,z"
    extra_hosts:
      # podman adds this name by itself; Docker on Linux needs it spelled out
      - "host.containers.internal:host-gateway"

volumes:
  caddy-data:
  caddy-config:
