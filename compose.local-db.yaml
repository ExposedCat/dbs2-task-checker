# Overlay: bundled databases for a self-contained deployment or local testing.
#
#   podman-compose -f compose.yaml -f compose.local-db.yaml up -d --build
#
# Adds a portal MongoDB, a sandbox MongoDB (auth enabled, root user from .env) and a
# sandbox Redis image running one RediSearch-enabled instance per student
# (redis-sandbox/instances.conf), and points the server at them.
services:
  server:
    environment:
      DB_CONNECTION_URL: mongodb://mongo:27017
      MONGO_SANDBOX_HOST: mongo-sandbox
      MONGO_SANDBOX_PORT: "27017"
      MONGO_SANDBOX_ROOT_URL: "mongodb://${MONGO_SANDBOX_ROOT_USERNAME:-root}:${MONGO_SANDBOX_ROOT_PASSWORD:?Set MONGO_SANDBOX_ROOT_PASSWORD in .env}@mongo-sandbox:27017"
      REDIS_SANDBOX_HOST: redis-sandbox
    depends_on:
      mongo:
        condition: service_healthy
      mongo-sandbox:
        condition: service_healthy
      redis-sandbox:
        condition: service_started

  # Portal database: users, question banks, submissions
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Sandbox MongoDB where student queries run (one database + user per student, auth enabled)
  mongo-sandbox:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_SANDBOX_ROOT_USERNAME:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_SANDBOX_ROOT_PASSWORD:?Set MONGO_SANDBOX_ROOT_PASSWORD in .env}"
    volumes:
      - mongo-sandbox-data:/data/db
    # Uncomment to let students connect directly (e.g. with Compass) on host port 42222
    # ports:
    #   - "42222:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Sandbox Redis: one RediSearch-enabled instance per student, configured in
  # redis-sandbox/instances.conf (<port>:<password> per line)
  redis-sandbox:
    build: ./redis-sandbox
    image: dbs2-task-checker-redis-sandbox
    restart: unless-stopped
    volumes:
      - ./redis-sandbox/instances.conf:/instances.conf:ro,z
      - redis-sandbox-data:/data

volumes:
  mongo-data:
  mongo-sandbox-data:
  redis-sandbox-data:
