# Adds only the portal DB; the separate host grading broker is still required.
services:
  server:
    environment:
      DB_CONNECTION_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  # Portal database: users, question banks, submissions
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
